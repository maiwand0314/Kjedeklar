name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bare syntetiske data og lokale Convex-backends i Docker. Ingen secrets brukes.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Installer låst avhengighetssett
        run: pnpm install --frozen-lockfile

      - name: Start tomme lokale Convex-backends og Mailpit
        run: docker compose up -d --wait convex convex-test mailpit

      - name: Deploy skjema og funksjoner til tom dev-backend
        run: pnpm convex:deploy:local

      - name: Kontroller at convex/_generated er committet og oppdatert
        run: git diff --exit-code convex/_generated

      - name: Seed syntetiske data
        run: pnpm seed:dev

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Enhets- og Convex-funksjonstester
        run: pnpm test:unit

      - name: Integrasjonstester mot lokal test-backend
        run: pnpm test:integration

      - name: Installer Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Last opp Playwright-rapport ved feil
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
